[project]
name = "chainliterate"
version = "0.1.0"
description = "Proof-of-concept platform for AI as a public good."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg",
    "boto3",
    "chainlit>=1.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
